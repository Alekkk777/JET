[project]
name = "ral-calculator-backend"
version = "0.1.0"
description = "Backend esagonale per il calcolo RAL -> netto e la sua spiegazione via chatbot"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "anthropic==0.42.0",
]

[tool.vercel]
entrypoint = "app.infrastructure.api.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI usa Depends(...) come default degli argomenti per design (dependency
# injection), non è il bug che la regola generalmente intercetta.
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["tests"]
